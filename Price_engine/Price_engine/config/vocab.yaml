model_name_stoplist:
  lux: adjektiv, 0,98 Mio men beskriver utförande inte modell
  fri: fraktord, halva frasen 'fri leverans'
_notes:
  hornsoffa: u-soffa m.fl. tillagda 2026-08-20. De fanns i type_system/lexicon.py CORNER_WORDS men saknades
    har, sa samma fraga gav typer=[] i cellfiltret och hornsoffa i attributkedjan. Tva lexikon oense om
    samma ord ger fel som inte syns i nagot enskilt test.
form_words:
  _note: Slutna listor som bild-LLM:en valjer ur. Orden MASTE finnas i product_types eller accessory_words,
    annars skriver modellen ord motorn inte kan lasa. tests/test_form_layer.py laser det.
  soffa:
  - rak soffa
  - hörnsoffa
  - u-soffa
  - bäddsoffa
  - divansoffa
  - schäslongsoffa
  bord:
  - matbord
  - soffbord
  - sidobord
  - skrivbord
  stol:
