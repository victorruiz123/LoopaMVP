  - pinnstol
  forvaring:
  - hylla
  - byrå
  - skänk
  - vitrinskåp
  - garderob
  _guidance:
    _om: 'Texterna läses BARA av bild-LLM:en och matchas aldrig mot korpusen, så de
      skrivs med korrekt svenska. De var förut ASCII-vikta ("BADA andar", "schaslong")
      helt i onödan. Omskrivna 2026-08-20 (ovaliderad): felet de rättar är att modellen
      kallade en rak soffa med LÖS puff bredvid för divansoffa, och en U-soffa för
      hörnsoffa. Skillnaden fastsittande/fristående saknades i definitionerna.'
    u-soffa: 'sitsen skjuter ut åt samma håll i BÅDA ändarna, så soffan bildar ett U.
      Detta gäller ÄVEN om soffan också har ett hörn — två utskjutande ändar slår alltid
      hörnsoffa.'
    hörnsoffa: 'sitsen viker av ungefär 90 grader i ETT hörn och bildar ett L. Utskjutande
      liggdel i bara den ena änden.'
    divansoffa: 'rak soffa där sitsen fortsätter i en FASTSITTANDE liggdel utan armstöd i
      ena änden, utan hörnmodul.'
    schäslongsoffa: 'samma som divansoffa; välj den om annonsen säger schäslong'
    rak soffa: 'sitsen går rakt hela vägen med armstöd i båda ändarna. En LÖS puff eller
      fotpall bredvid gör den INTE till divansoffa — den förblir rak soffa.'
    bäddsoffa: 'går att fälla ut till säng'
accessory_words:
  _note: 'Tillbehor LLM:en far skriva in i fragan som ''+ <ord>'' sa buntlogiken ser dem.
    schaslong och divan ar BORTTAGNA: de ar sektionsord (delar av en modulsoffa), inte
    tillbehor. ''+ schaslong'' hade gjort en hel soffa till en bunt.'
  _inkludering: 'SMALNAD 2026-08-20 (ovaliderad). Listan holl tidigare aven dyna, kudde,
    sidobord och kladsel. De ar rekvisita i stajlade foton, inte varor i affaren: matningen
    av set_items gav 100 % falsklarm pa INKLUDERING. Ett sidobord bredvid en Lamino skrevs
    in som ''+ sidobord'' och gjorde fotot till en bunt. Kvar star bara tillbehor som (a)
    normalt saljs som EN enhet med mobeln och (b) flyttar priset markbart — en fotpall till
    en Lamino ar ~40 % av varden, en soffkudde ar ~0.'
  words:
  - fotpall
  - sittpuff
  - stolar
  - hyllplan
