<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2848 1088" role="img" aria-label="Loopa">
  <!-- Ordmärket loopa, satt i Poppins ExtraBold och omvandlat till kurvor.
       KURVOR OCH INTE <text>: en favikon renderas utanför sidan, så varken Google Fonts eller
       systemets fontstack finns att tillgå — ett <text> hade ritats i vad webbläsaren nu råkar ha,
       eller inte alls. Formen ligger därför i path-datan och kan inte glida.
       Bokstaven som bär märket är gemena "a": enkelvånings, en cirkel med en stapel. Se
       --ordmark-font i web/src/styles.css för varför just den formen är logotypen.
       Tegelorange #e4572e, samma som --accent. Bakgrunden är genomskinlig med flit: märket ska
       sitta lika bra på en ljus som på en mörk flik.
       Spärren -0.015em är inbakad i bokstävernas placering, som i .app-wordmark.
       viewBox:en är ordets egen bbox — märket är brett, och i 16 px blir det ett orange streck
       snarare än fem läsbara bokstäver. Det är priset för att fliken bär ordet och inte en symbol. -->
  <title>Loopa</title>
