<!doctype html>
<!-- Utvecklingsvy: appen i en telefonram, 390 × 844 (iPhone 14). Sidan i ramen väljs med ?sida=/vägen.
     Ingår inte i bygget — Vite bygger bara index.html — och serveras bara av `npm run web:dev`. -->
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Telefonvy</title>
<style>
  body {
    margin: 0; min-height: 100vh; box-sizing: border-box; padding: 28px 16px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    background: #2b2622; color: #e9e2d6; font-family: system-ui, sans-serif;
  }
  nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  nav a {
    font: 600 13px system-ui, sans-serif; color: #e9e2d6; background: #3d3630;
    border-radius: 999px; padding: 8px 14px; text-decoration: none;
  }
  nav a.on { background: #e4572e; color: #fff; }
  .telefon {
    width: 390px; height: 844px; flex-shrink: 0; box-sizing: content-box;
    padding: 12px; border-radius: 52px; background: #111;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 0 0 2px #3a3a3a;
  }
  iframe { width: 100%; height: 100%; border: 0; border-radius: 40px; background: #faf7f1; }
  p { margin: 0; font-size: 13px; color: #a39a8e; text-align: center; }
</style>
</head>
<body>
<nav id="nav"></nav>
<div class="telefon"><iframe id="ram" title="Telefonvy"></iframe></div>
<p>390 × 844. Ramen är en vanlig sida i appen, så inloggning och flöde fungerar som på en telefon.</p>
<script>
  var sidor = [
    ["Letar upp modellen", "/wait.html"],
    ["Bygger annonsen", "/wait.html#bygger"],
    ["Annonsen + Sälj med Loopa", "/annons.html"],
    ["Hela appen", "/"],
  ];
  var vald = new URLSearchParams(location.search).get("sida") || "/wait.html";
  var nav = document.getElementById("nav");
  sidor.forEach(function (s) {
    var a = document.createElement("a");
    a.textContent = s[0];
    a.href = "?sida=" + encodeURIComponent(s[1]);
    if (s[1] === vald) a.className = "on";
    nav.appendChild(a);
  });
  document.getElementById("ram").src = vald;
</script>
</body>
</html>
