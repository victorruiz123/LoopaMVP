<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter, samma snitt och samma vikter som loopa.se. 800 finns med för ordmärket: det
         sätts i tyngsta vikten och skulle annars syntetiseras fram ur 700 av webbläsaren.

         Poppins i fem vikter, för KÖPSIDANS LANDNINGSSIDA är satt i det snittet — inte bara
         ordmärket. Snittet är geometriskt: dess gemena "a" är enkelvånings, en cirkel med en
         stapel, och sidan får sin karaktär ur just den bokstavsformen. Låg tidigare här i 800
         som ett undantag för fem bokstäver; nu bär det en hel sida och behöver ljus, normal och
         medium för brödtext och fält utöver de två feta för rubriker.

         Ett anrop, inte två: css2 tar flera family-parametrar i samma förfrågan. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;700;800&display=swap"
    />
    <meta name="theme-color" content="#faf7f1" />

    <!-- Ordmärket går inte att läsa i 16 px, så fliken bär loopen ur det i samma
         tegelorange som appen. SVG:n skalar till varje storlek utan en egen fil per mått. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Manifestet gör appen installerbar, och det är förutsättningen för share_target: en delning
         från Blocket-appen landar på /kop/analysera med annonsens adress ifylld. Fungerar BARA när
         appen lagts till på hemskärmen — i en vanlig flik finns ingen delningsmeny att vara mål för,
         och därför går fältet alltid att fylla i för hand. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Loopa – Sälj din möbel</title>
    <meta
      name="description"
      content="Sälj med Loopa: filma ett varv runt möbeln, så skriver vi annonsen, sätter priset, lägger ut den till salu och hör av oss när den är såld."
    />

    <!-- Delas appen som länk är det de här taggarna som blir kortet. Utan dem visar
         LinkedIn en naken URL. Ingen og:image än — lägg en 1200×630 på /og.png och
         peka hit, så får kortet en miniatyr också. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Loopa" />
    <meta property="og:title" content="Loopa – sälj din begagnade möbel" />
    <meta
      property="og:description"
      content="Filma ett varv runt möbeln. Vi gör annonsen, säljer möbeln och hör av oss när den är såld — och annonsen är publik, så köparen kan kontrollera skicket."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
