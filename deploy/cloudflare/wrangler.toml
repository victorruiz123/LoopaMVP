# Routern som lägger butiken på marknadsdomänen. Se loopa-router.js för vad den gör och varför.
#
# Deploya från den här mappen:
#   npx wrangler login
#   npx wrangler deploy
#
# Rutterna står HÄR och inte i dashboard med flit: de är tio stycken, de hör ihop med koden, och en
# rutt som glöms bort ger ett fel som ser ut som något helt annat — en vit sida, eller
# marknadssajten där butiken skulle stå. Deployas de tillsammans kan de inte glida isär.

name = "loopa-router"
main = "loopa-router.js"
compatibility_date = "2026-01-01"

# ─── Appens sidor ───────────────────────────────────────────────────────────
#
# ROTEN ÄR VÅR. loopa.nu/ visar säljflödet — det är appens startsida, på den domän folk faktiskt
# skriver in. Marknadssajtens företagssida bor kvar på loopa.nu/company och nås därifrån.
#
# EN WORKER-RUTT VINNER ÖVER EN OMDIRIGERINGSREGEL, tvärtemot vad man tror. Det upptäcktes när
# rutten låg här en kort stund innan roten skulle flytta, och roten genast visade säljflödet.
# Numera är det själva poängen — men det gör också ordningen nedan icke förhandlingsbar.
#
# ORDNINGEN VID UTRULLNING:
#   1. Ta bort omdirigeringsregeln loopa.nu/ → /company i Cloudflare (Rules → Redirect Rules)
#   2. `npx wrangler deploy` härifrån
#   3. Rulla servern (roten kanoniseras nu som allt annat, se butik/seo.ts)
#
# Görs 3 före 1 är den gamla kedjan tillbaka: app.loopa.nu/ → 301 → loopa.nu/ → 302 → /company, och
# säljflödet går inte att nå från någon adress alls. Det hände i drift en gång, och regeln kördes
# före Workers just då eftersom rutten här ännu inte fanns.
[[routes]]
pattern = "loopa.nu/"
zone_name = "loopa.nu"

# ─── /salj: den gamla adressen, som fortfarande måste svara ────────────────
#
# /salj var säljflödets adress den vecka roten ännu gick till företagssidan. Den står i länkar vi
# delat, och servern 301:ar den numera till roten (se server.ts) så att säljflödet har EN adress.
#
# RUTTEN LIGGER KVAR PRECIS DÄRFÖR. Tas den bort svarar marknadssajten på /salj i stället — en 404
# från en annan sajt — och omdirigeringen får aldrig chansen att köra. En rutt som pekar på en
# server som svarar 301 är hur en gammal adress dör med hedern i behåll.
#
# Två mönster och inte "loopa.nu/salj*": stjärnan hade också fångat /saljare och vad marknadssajten
# än lägger där i framtiden. Den här rutten ska äga precis två adresser.
[[routes]]
pattern = "loopa.nu/salj"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/salj/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/butik*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/kop*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/efterlyses*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/affar*"
zone_name = "loopa.nu"

# Affärsinbjudningar: korta länkar som delas i ett meddelande.
[[routes]]
pattern = "loopa.nu/a/*"
zone_name = "loopa.nu"

# Sanningskorten. Ligger kvar på app.loopa.nu också — publicerade Tradera-annonser bär den
# adressen inbakad — men nya länkar ska kunna vara korta.
[[routes]]
pattern = "loopa.nu/c/*"
zone_name = "loopa.nu"

# De juridiska sidorna. Också de Merchant Center kommer att kräva.
[[routes]]
pattern = "loopa.nu/villkor"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/integritetspolicy"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/cookies"
zone_name = "loopa.nu"

# ─── Sökmotorernas filer ────────────────────────────────────────────────────
[[routes]]
pattern = "loopa.nu/sitemap.xml"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/robots.txt"
zone_name = "loopa.nu"

# ─── Appens byggda filer ────────────────────────────────────────────────────
#
# Marknadssajten äger /assets. Utan den här raden hämtar appen marknadssajtens JavaScript och
# visar en vit skärm — vilket är precis varför bygget flyttades till /app-assets.
[[routes]]
pattern = "loopa.nu/app-assets/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/manifest.webmanifest"
zone_name = "loopa.nu"

# ─── API:t ──────────────────────────────────────────────────────────────────
#
# EN RAD PER NAMNRYMD, aldrig hela /api/*. Marknadssajten har egna Pages Functions på /api/chat,
# /api/generate-listing, /api/brand-preview och /api/seller/* — ett band till hela prefixet hade
# dödat dem. Listan nedan är serverns namnrymder (server.ts) och måste utökas den dag en till
# tillkommer. Det är priset för att marknadssajten får behålla sitt eget /api.
#
# JÄMFÖR MOT SERVERN, inte mot klienten. `grep -roE "/api/[a-z-]+" web/src` missar varje namnrymd
# vars adress servern lämnar ifrån sig som data, och det var så /api/kandidatbild kunde saknas här
# medan klientkontrollen såg ren ut. Den som faktiskt täcker allt:
#   grep -oE 'segments\[1\] === "[a-z-]+"' server/src/server.ts | grep -oE '"[a-z-]+"' | tr -d '"' | sort -u
[[routes]]
pattern = "loopa.nu/api/admin/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/affar/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/analys*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/butik/*"
zone_name = "loopa.nu"

# Produktbilderna. Utan den här är varje möbel en trasig bild — även i Google Shopping.
[[routes]]
pattern = "loopa.nu/api/cards/*"
zone_name = "loopa.nu"

# Modellväljarens miniatyrer. Samma sort som /api/cards ovan, och samma sorts fel utan raden:
# marknadssajten svarar med sitt eget appskal — 1,5 kB text/html med statuskod 200 — och varje ruta i
# väljaren blir tom. `onError` utlöses inte ens: svaret ÄR ett svar, bara inte en bild.
#
# DEN HÄR MISSADES FÖR ATT KLIENTEN ALDRIG SKRIVER ADRESSEN. Kontrollen som står ovan —
# `grep -roE "/api/[a-z-]+" web/src` — hittar de namnrymder klienten anropar själv. Miniatyrens
# adress kommer i stället FRÅN servern, som ett fält i kandidatlistan (kandidatbild.ts, URL_PREFIX),
# och hamnar rakt i en `<img src>`. Den syns alltså inte i klientens källkod alls.
[[routes]]
pattern = "loopa.nu/api/kandidatbild/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/condition*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/efterlysning/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/jobs*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/price*"
zone_name = "loopa.nu"

# Startsidans chatt ("Hur fungerar det?"). Den enda av klientens tio API-namnrymder som saknades
# här — utan raden svarar marknadssajtens egna Pages Functions på /api/salj/chat, och rutan säger
# att anropet misslyckades. Sidan hade sett hel ut och varit trasig på precis det ställe den finns
# för. Se listan i klienten: grep -roE "/api/[a-z-]+" web/src.
[[routes]]
pattern = "loopa.nu/api/salj/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/session*"
zone_name = "loopa.nu"

# Mätningen av flödet. Klienten skickar den med `navigator.sendBeacon` (web/src/lib/flode.ts), och
# en beacon rapporterar aldrig att den misslyckades — utan den här raden svarade marknadssajten 405
# och varje steg en säljare tog på loopa.nu föll i tysthet. Det var inte synligt någonstans: sidan
# fungerade, siffrorna bara saknades, och de saknades mest för den domän vi flyttat allt till.
[[routes]]
pattern = "loopa.nu/api/data/*"
zone_name = "loopa.nu"

# Frågan om processen, som säljaren får efter ett lyckat ja. Samma fälla som /api/salj/chat ovan:
# utan raden svarar marknadssajtens egna Pages Functions, och rutan säger att anropet misslyckades
# på precis det ställe vi ber om förtroende. Adminpanelens läsning ligger under /api/admin/feedback
# och täcks redan av admin-raden.
[[routes]]
pattern = "loopa.nu/api/feedback*"
zone_name = "loopa.nu"
