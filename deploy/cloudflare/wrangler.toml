# Routern som lägger butiken på marknadsdomänen. Se loopa-router.js för vad den gör och varför.
#
# Deploya från den här mappen:
#   npx wrangler login
#   npx wrangler deploy
#
# Rutterna står HÄR och inte i dashboard med flit: de är tio stycken, de hör ihop med koden, och en
# rutt som glöms bort ger ett fel som ser ut som något helt annat — en vit sida, eller
# marknadssajten där butiken skulle stå. Deployas de tillsammans kan de inte glida isär.

name = "loopa-router"
main = "loopa-router.js"
compatibility_date = "2026-01-01"

# ─── Appens sidor ───────────────────────────────────────────────────────────
#
# ROTEN ÄR MEDVETET INTE MED — den läggs till vid lansering.
#
# loopa.nu/ ska visa marknadssajtens företagssida fram till dess. Rutten fanns här en kort stund och
# togs bort igen: en Worker-rutt VINNER över Cloudflares omdirigeringsregel, tvärtemot vad jag antog,
# så roten började genast visa säljflödet.
#
# VID LANSERING, i den här ordningen:
#   1. Lägg tillbaka blocket nedan och kör `npx wrangler deploy`
#   2. Ta bort omdirigeringsregeln loopa.nu/ → /company i Cloudflare (Rules → Redirect Rules)
#   3. Sätt LOOPA_ROT_FLYTTAD=1 i server/.env och starta om, så att app.loopa.nu/ pekar hit
#
# [[routes]]
# pattern = "loopa.nu/"
# zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/butik*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/kop*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/efterlyses*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/affar*"
zone_name = "loopa.nu"

# Affärsinbjudningar: korta länkar som delas i ett meddelande.
[[routes]]
pattern = "loopa.nu/a/*"
zone_name = "loopa.nu"

# Sanningskorten. Ligger kvar på app.loopa.nu också — publicerade Tradera-annonser bär den
# adressen inbakad — men nya länkar ska kunna vara korta.
[[routes]]
pattern = "loopa.nu/c/*"
zone_name = "loopa.nu"

# De juridiska sidorna. Också de Merchant Center kommer att kräva.
[[routes]]
pattern = "loopa.nu/villkor"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/integritetspolicy"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/cookies"
zone_name = "loopa.nu"

# ─── Sökmotorernas filer ────────────────────────────────────────────────────
[[routes]]
pattern = "loopa.nu/sitemap.xml"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/robots.txt"
zone_name = "loopa.nu"

# ─── Appens byggda filer ────────────────────────────────────────────────────
#
# Marknadssajten äger /assets. Utan den här raden hämtar appen marknadssajtens JavaScript och
# visar en vit skärm — vilket är precis varför bygget flyttades till /app-assets.
[[routes]]
pattern = "loopa.nu/app-assets/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/manifest.webmanifest"
zone_name = "loopa.nu"

# ─── API:t ──────────────────────────────────────────────────────────────────
#
# EN RAD PER NAMNRYMD, aldrig hela /api/*. Marknadssajten har egna Pages Functions på /api/chat,
# /api/generate-listing, /api/brand-preview och /api/seller/* — ett band till hela prefixet hade
# dödat dem. Listan nedan är serverns tio namnrymder (server.ts) och måste utökas den dag en elfte
# tillkommer. Det är priset för att marknadssajten får behålla sitt eget /api.
[[routes]]
pattern = "loopa.nu/api/admin/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/affar/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/analys*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/butik/*"
zone_name = "loopa.nu"

# Produktbilderna. Utan den här är varje möbel en trasig bild — även i Google Shopping.
[[routes]]
pattern = "loopa.nu/api/cards/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/condition*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/efterlysning/*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/jobs*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/price*"
zone_name = "loopa.nu"

[[routes]]
pattern = "loopa.nu/api/session*"
zone_name = "loopa.nu"
